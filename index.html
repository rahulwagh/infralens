<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfraLens</title>
<meta name="description" content="Offline, read-only bird's-eye view of a Terraform/GCP infra-config repository.">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1b2430; --ink-2: #536070; --ink-3: #8a94a3;
    --line: #dde2e9; --line-2: #eef1f5; --accent: #1f5fbf; --accent-bg: #e8f0fc;
    --high: #b3261e; --high-bg: #fbe9e7; --med: #9a5b00; --med-bg: #fff3dc; --low: #2e6b3f; --low-bg: #e6f3ea;
    --code: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --radius: 4px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15191f; --panel: #1d2229; --ink: #e6eaf0; --ink-2: #aab4c2; --ink-3: #6f7a89;
    --line: #2d343e; --line-2: #252b34; --accent: #7aa7f0; --accent-bg: #1e2b44;
    --high: #ff8a80; --high-bg: #3a1f1d; --med: #ffc46b; --med-bg: #3a2c12; --low: #8fd3a3; --low-bg: #1d3324;
  } }
  :root[data-theme="dark"] {
    --bg: #15191f; --panel: #1d2229; --ink: #e6eaf0; --ink-2: #aab4c2; --ink-3: #6f7a89;
    --line: #2d343e; --line-2: #252b34; --accent: #7aa7f0; --accent-bg: #1e2b44;
    --high: #ff8a80; --high-bg: #3a1f1d; --med: #ffc46b; --med-bg: #3a2c12; --low: #8fd3a3; --low-bg: #1d3324;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
  code, .mono { font-family: var(--code); font-size: 12.5px; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- shell ---- */
  #app { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header h1 span { color: var(--ink-3); font-weight: 400; margin-left: 8px; }
  #search { flex: 1; max-width: 520px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink); font: inherit; }
  #search::placeholder { color: var(--ink-3); }
  .hbtn { padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; }
  .hbtn:hover { border-color: var(--accent); }
  #repoName { color: var(--ink-2); font-size: 13px; }
  nav { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 0; }
  nav .grp { padding: 10px 16px 4px; font-size: 11.5px; color: var(--ink-3); }
  nav button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 16px; border: 0; background: transparent; text-align: left; cursor: pointer; border-left: 3px solid transparent; }
  nav button:hover { background: var(--line-2); }
  nav button.active { background: var(--accent-bg); border-left-color: var(--accent); color: var(--accent); font-weight: 600; }
  nav .n { font-family: var(--code); font-size: 12px; color: var(--ink-3); }
  nav button.active .n { color: var(--accent); }
  main { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr; }
  main.with-drawer { grid-template-columns: 1fr 420px; }
  #view { overflow: auto; padding: 18px 22px 40px; }
  #drawer { display: none; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; }
  main.with-drawer #drawer { display: block; }

  /* ---- content ---- */
  h2 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--ink-2); margin: 0 0 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .toolbar input, .toolbar select { padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); font: inherit; }
  .toolbar .count { color: var(--ink-3); margin-left: auto; font-size: 13px; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; background: var(--line-2); color: var(--ink-2); margin: 1px 2px 1px 0; white-space: nowrap; }
  .chip.high { background: var(--high-bg); color: var(--high); } .chip.med { background: var(--med-bg); color: var(--med); } .chip.low { background: var(--low-bg); color: var(--low); }
  .chip.accent { background: var(--accent-bg); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--panel); font-weight: 600; font-size: 12.5px; color: var(--ink-2); border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; }
  th.sorted::after { content: " ↕"; color: var(--ink-3); } th.asc::after { content: " ↑"; } th.desc::after { content: " ↓"; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--line-2); } tbody tr.sel { background: var(--accent-bg); }
  .tbl { overflow: auto; max-height: calc(100vh - 170px); border: 1px solid var(--line); background: var(--panel); }
  .tbl table { border: 0; width: max-content; min-width: 100%; }
  td .mono { white-space: nowrap; }
  td .chip.mono { white-space: nowrap; }
  .muted { color: var(--ink-3); }
  .empty { padding: 36px 20px; text-align: center; color: var(--ink-2); background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); }

  /* overview */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; }
  .stat:hover { border-color: var(--accent); }
  .stat b { display: block; font-size: 22px; font-weight: 600; line-height: 1.1; }
  .stat small { color: var(--ink-2); }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .box h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .tree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px solid var(--line); }
  .tree > ul { padding-left: 0; border: 0; }
  .tree li { margin: 4px 0; }
  .tree .fld { color: var(--ink-2); font-weight: 600; }
  .tree .prj { display: inline-flex; gap: 8px; align-items: center; padding: 3px 8px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; background: var(--bg); margin: 2px 0; }
  .tree .prj:hover { border-color: var(--accent); }
  .tree .prj .mono { font-size: 12px; }
  .finding-row { display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); cursor: pointer; }
  .finding-row:last-child { border-bottom: 0; }
  .finding-row:hover .t { color: var(--accent); }
  .sev { font-size: 11.5px; font-weight: 600; padding: 2px 0; text-align: center; border-radius: 3px; height: fit-content; }
  .sev.high { background: var(--high-bg); color: var(--high); } .sev.med { background: var(--med-bg); color: var(--med); } .sev.low { background: var(--low-bg); color: var(--low); }
  .finding-row .d { color: var(--ink-2); font-size: 13px; }

  /* matrix */
  .matrix { overflow: auto; }
  .matrix table { width: auto; }
  .matrix th.rot { height: 150px; white-space: nowrap; vertical-align: bottom; padding: 0 4px; }
  .matrix th.rot > div { transform: rotate(-60deg); transform-origin: left bottom; width: 20px; }
  .matrix td.c { text-align: center; font-family: var(--code); font-size: 11px; padding: 3px 6px; }
  .matrix td.c.has { background: var(--accent-bg); color: var(--accent); }
  .matrix td.c.risky { background: var(--high-bg); color: var(--high); font-weight: 600; }

  /* drawer */
  #drawer .hd { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  #drawer .hd h3 { margin: 0; font-size: 15px; font-weight: 600; word-break: break-all; }
  #drawer .hd .k { color: var(--ink-3); font-size: 12px; }
  #drawer .close { margin-left: auto; border: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--ink-2); }
  #drawer section { padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
  #drawer h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
  dl { display: grid; grid-template-columns: 130px 1fr; gap: 4px 10px; margin: 0; }
  dt { color: var(--ink-3); font-size: 12.5px; } dd { margin: 0; word-break: break-word; }
  .rel { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--line-2); cursor: pointer; }
  .rel:hover { color: var(--accent); } .rel .k { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
  pre { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; font-family: var(--code); font-size: 12px; overflow: auto; max-height: 420px; white-space: pre-wrap; word-break: break-all; }
  .src { font-family: var(--code); font-size: 12px; color: var(--ink-2); }

  /* landing */
  #landing { max-width: 640px; margin: 60px auto; }
  #landing h2 { font-size: 26px; }
  #landing p { color: var(--ink-2); max-width: 60ch; }
  .big { display: inline-block; padding: 10px 16px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent); color: #fff; cursor: pointer; margin: 6px 8px 6px 0; }
  .big.alt { background: transparent; color: var(--accent); }
  #landing ol { color: var(--ink-2); padding-left: 20px; }
  .err { color: var(--high); }
  @media (prefers-reduced-motion: no-preference) { tbody tr, .stat, .prj { transition: background .12s, border-color .12s; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>InfraLens <span id="repoName"></span></h1>
    <input id="search" type="search" placeholder="Search everything — project id, CIDR, SA email, role, group, constraint…" autocomplete="off" disabled>
    <button class="hbtn" id="btnOpen" title="Open a different repo folder">Open folder</button>
    <button class="hbtn" id="btnRescan" title="Re-read the same folder, e.g. after git pull" disabled>Re-scan</button>
    <button class="hbtn" id="btnExport" title="Download the normalized model as JSON" disabled>Export model</button>
    <button class="hbtn" id="btnTheme" title="Toggle light/dark">Theme</button>
  </header>
  <nav id="nav"></nav>
  <main id="main">
    <div id="view"></div>
    <aside id="drawer"></aside>
  </main>
</div>
<input type="file" id="dirInput" webkitdirectory directory multiple hidden>

<script src="adapters/hcl.js"></script>
<script src="adapters/default.js"></script>
<script src="adapters/gcloud.js"></script>
<script src="adapters/terraform.js"></script>
<!-- estate.js is written by sync.cmd / sync.sh next to this file and holds every file
     of the workspace. Missing until the first sync; the page then falls back to the
     folder picker and the saved copy. -->
<script src="estate.js"></script>
<script>
(function () {
'use strict';

/* =========================================================================
   1. SECTIONS — what the left rail shows and how each entity type renders
   ========================================================================= */
const SECTIONS = [
  { id: 'overview', label: 'Overview', group: 'Estate' },
  { id: 'findings', label: 'Findings', group: 'Estate', countOf: 'findings' },
  { id: 'projects', label: 'Projects', group: 'Estate', kind: 'projects',
    cols: [['id','Project', 'mono'], ['name','Name'], ['folder','Folder','mono'], ['labels.env','Env'], ['labels.owner','Owner'], ['shared_vpc_host','Shared VPC host','mono']] },
  { id: 'folders', label: 'Folders', group: 'Estate', kind: 'folders',
    cols: [['id','Folder','mono'], ['name','Name'], ['parent','Parent','mono']] },
  { id: 'networks', label: 'Networks', group: 'Network', kind: 'networks',
    cols: [['name','VPC','mono'], ['project','Project','mono'], ['routing_mode','Routing'], ['shared_vpc_host','Host', 'bool'], ['service_projects','Service projects','list']] },
  { id: 'subnets', label: 'Subnets', group: 'Network', kind: 'subnets',
    cols: [['name','Subnet','mono'], ['cidr','CIDR','mono'], ['region','Region'], ['network','Network','mono'], ['private_google_access','PGA','bool'], ['flow_logs','Flow logs','bool'], ['secondary_ranges','Secondary','ranges']] },
  { id: 'peerings', label: 'Peerings', group: 'Network', kind: 'peerings',
    cols: [['name','Peering','mono'], ['network','Network','mono'], ['peer_network','Peer','mono'], ['export_custom_routes','Export routes','bool'], ['import_custom_routes','Import routes','bool']] },
  { id: 'firewall_rules', label: 'Firewall rules', group: 'Network', kind: 'firewall_rules',
    cols: [['name','Rule','mono'], ['project','Project','mono'], ['direction','Dir'], ['action','Action'], ['priority','Prio'], ['source_ranges','Sources','list'], ['destination_ranges','Destinations','list'], ['target_tags','Target tags','list'], ['target_service_accounts','Target SAs','list'], ['rules','Protocols/ports','ports'], ['logging','Log','bool'], ['disabled','Off','bool']] },
  { id: 'iam_bindings', label: 'IAM bindings', group: 'Identity', kind: 'iam_bindings',
    cols: [['principal','Principal','mono'], ['principal_type','Type'], ['role','Role','mono'], ['resource_type','On'], ['resource','Resource','mono'], ['condition.title','Condition']] },
  { id: 'iam_matrix', label: 'Access matrix', group: 'Identity' },
  { id: 'service_accounts', label: 'Service accounts', group: 'Identity', kind: 'service_accounts',
    cols: [['email','Email','mono'], ['project','Project','mono'], ['display_name','Name'], ['description','Description']] },
  { id: 'wif', label: 'Workload identity', group: 'Identity' },
  { id: 'vpc_sc', label: 'VPC Service Controls', group: 'Policy' },
  { id: 'org_policies', label: 'Org policies', group: 'Policy', kind: 'org_policies',
    cols: [['constraint','Constraint','mono'], ['scope_type','Scope'], ['scope','On','mono'], ['policy_type','Type'], ['enforce','Enforce','bool'], ['allow','Allow','list'], ['deny','Deny','list'], ['deny_all','Deny all','bool'], ['reason','Reason']] },
  { id: 'repos', label: 'Repositories', group: 'Repository' },
  { id: 'files', label: 'Source files', group: 'Repository' },
  { id: 'other', label: 'Terraform objects', group: 'Repository', kind: 'other',
    cols: [['kind','Kind'], ['id','Address','mono'], ['project','Project','mono'], ['summary','Name / source','mono'], ['mapped','Mapped','bool']] },
];

/* =========================================================================
   2. FINDINGS — rules run on the canonical model. Add your own here.
   Each rule: { id, severity: high|med|low, title, test(model) -> array of {entity_kind, entity_id, detail} }
   ========================================================================= */
const PRIMITIVE_ROLES = new Set(['roles/owner', 'roles/editor']);
const IMPERSONATION_ROLES = new Set(['roles/iam.serviceAccountTokenCreator', 'roles/iam.serviceAccountUser', 'roles/iam.serviceAccountKeyAdmin', 'roles/iam.workloadIdentityUser']);
const isPublicRange = (r) => r === '0.0.0.0/0' || r === '::/0';
const isWide = (p) => !p || p === '0-65535' || p === '1-65535';
const FINDINGS = [
  { id: 'fw-public-ingress', severity: 'high', title: 'Firewall allows ingress from the internet',
    test: (m) => m.firewall_rules.filter(r => !r.disabled && r.direction === 'INGRESS' && r.action === 'allow' && (r.source_ranges || []).some(isPublicRange))
      .map(r => ({ entity_kind: 'firewall_rules', entity_id: r.id, detail: `${r.name}: ${r.rules.map(x => x.protocol + (x.ports ? ':' + x.ports.join(',') : '')).join(' ')} ${r.target_tags ? 'to tags ' + r.target_tags.join(',') : r.target_service_accounts ? 'to SAs' : 'to ALL instances'}` })) },
  { id: 'fw-wide-ports', severity: 'med', title: 'Firewall rule allows all ports / all protocols',
    test: (m) => m.firewall_rules.filter(r => !r.disabled && r.action === 'allow' && r.rules.some(x => x.protocol === 'all' || ((x.protocol === 'tcp' || x.protocol === 'udp') && (x.ports || []).some(isWide))))
      .map(r => ({ entity_kind: 'firewall_rules', entity_id: r.id, detail: `${r.name} (${r.direction}, prio ${r.priority}) from ${(r.source_ranges || r.destination_ranges || ['-']).join(', ')}` })) },
  { id: 'fw-no-logging', severity: 'low', title: 'Allow rule without firewall logging',
    test: (m) => m.firewall_rules.filter(r => !r.disabled && r.action === 'allow' && !r.logging).map(r => ({ entity_kind: 'firewall_rules', entity_id: r.id, detail: r.name })) },
  { id: 'fw-disabled', severity: 'low', title: 'Disabled firewall rule still in config',
    test: (m) => m.firewall_rules.filter(r => r.disabled).map(r => ({ entity_kind: 'firewall_rules', entity_id: r.id, detail: `${r.name} — remove if no longer needed` })) },
  { id: 'iam-public', severity: 'high', title: 'IAM binding to allUsers / allAuthenticatedUsers',
    test: (m) => m.iam_bindings.filter(b => b.principal_type === 'allUsers' || b.principal_type === 'allAuthenticatedUsers').map(b => ({ entity_kind: 'iam_bindings', entity_id: b.id, detail: `${b.principal} has ${b.role} on ${b.resource}` })) },
  { id: 'iam-primitive', severity: 'high', title: 'Primitive role (owner/editor) granted',
    test: (m) => m.iam_bindings.filter(b => PRIMITIVE_ROLES.has(b.role)).map(b => ({ entity_kind: 'iam_bindings', entity_id: b.id, detail: `${b.principal} is ${b.role} on ${b.resource}` })) },
  { id: 'iam-user-direct', severity: 'med', title: 'Role granted to an individual user (not a group)',
    test: (m) => m.iam_bindings.filter(b => b.principal_type === 'user').map(b => ({ entity_kind: 'iam_bindings', entity_id: b.id, detail: `${b.principal}: ${b.role} on ${b.resource}` })) },
  { id: 'iam-external-domain', severity: 'high', title: 'Principal outside the organisation domain',
    test: (m) => { const d = m.meta && m.meta.org_domain; if (!d) return [];
      return m.iam_bindings.filter(b => (b.principal_type === 'user' || b.principal_type === 'group') && !b.principal.endsWith('@' + d))
        .map(b => ({ entity_kind: 'iam_bindings', entity_id: b.id, detail: `${b.principal}: ${b.role} on ${b.resource}` })); } },
  { id: 'iam-sa-impersonation', severity: 'med', title: 'Service account can be impersonated / used',
    test: (m) => m.iam_bindings.filter(b => b.resource_type === 'service_account' && IMPERSONATION_ROLES.has(b.role)).map(b => ({ entity_kind: 'iam_bindings', entity_id: b.id, detail: `${b.principal} → ${b.role} on ${b.resource}` })) },
  { id: 'iam-sa-key-admin', severity: 'high', title: 'Service account key admin granted',
    test: (m) => m.iam_bindings.filter(b => b.role === 'roles/iam.serviceAccountKeyAdmin').map(b => ({ entity_kind: 'iam_bindings', entity_id: b.id, detail: `${b.principal} on ${b.resource}` })) },
  { id: 'iam-org-level-sa', severity: 'med', title: 'Service account holds organisation-level role',
    test: (m) => m.iam_bindings.filter(b => b.resource_type === 'organization' && b.principal_type === 'serviceAccount').map(b => ({ entity_kind: 'iam_bindings', entity_id: b.id, detail: `${b.principal}: ${b.role}` })) },
  { id: 'wif-no-condition', severity: 'high', title: 'Workload identity provider without attribute condition',
    test: (m) => m.wif_providers.filter(p => !p.attribute_condition || !p.attribute_condition.trim()).map(p => ({ entity_kind: 'wif_providers', entity_id: p.id, detail: `${p.id} (${p.issuer_uri || p.type}) — any token from this issuer is accepted` })) },
  { id: 'wif-broad-binding', severity: 'med', title: 'Workload identity binding at workspace/owner scope',
    test: (m) => m.wif_bindings.filter(b => /attribute\.(workspace|repository_owner|owner)\//.test(b.principal_set) || /\/\*$/.test(b.principal_set)).map(b => ({ entity_kind: 'wif_bindings', entity_id: b.id, detail: `${b.principal_set} → ${b.service_account}` })) },
  { id: 'subnet-no-pga', severity: 'low', title: 'Subnet without Private Google Access',
    test: (m) => m.subnets.filter(s => s.private_google_access === false).map(s => ({ entity_kind: 'subnets', entity_id: s.id, detail: s.id })) },
  { id: 'subnet-no-flowlogs', severity: 'low', title: 'Subnet without VPC flow logs',
    test: (m) => m.subnets.filter(s => s.flow_logs === false).map(s => ({ entity_kind: 'subnets', entity_id: s.id, detail: s.id })) },
  { id: 'vpcsc-outside', severity: 'med', title: 'Production project outside any VPC-SC perimeter',
    test: (m) => { const inside = new Set(m.vpc_sc_perimeters.flatMap(p => p.projects));
      return m.projects.filter(p => (p.labels && p.labels.env === 'prod') && !inside.has(p.id)).map(p => ({ entity_kind: 'projects', entity_id: p.id, detail: p.id })); } },
  { id: 'vpcsc-egress', severity: 'med', title: 'VPC-SC egress policy defined',
    test: (m) => m.vpc_sc_perimeters.filter(p => (p.egress_policies || []).length).map(p => ({ entity_kind: 'vpc_sc_perimeters', entity_id: p.id, detail: `${p.name}: ${p.egress_policies.length} egress rule(s)` })) },
  { id: 'orgpol-override', severity: 'med', title: 'Org policy relaxed below organisation level',
    test: (m) => { const orgLevel = new Map(m.org_policies.filter(p => p.scope_type === 'organization').map(p => [p.constraint, p]));
      return m.org_policies.filter(p => p.scope_type !== 'organization' && orgLevel.has(p.constraint) && orgLevel.get(p.constraint).enforce === true && p.enforce === false)
        .map(p => ({ entity_kind: 'org_policies', entity_id: p.id, detail: `${p.constraint} not enforced on ${p.scope}${p.reason ? ' — ' + p.reason : ''}` })); } },
];

/* =========================================================================

const S = { files: [], model: null, index: null, findings: [], section: 'overview', selected: null, query: '', sort: {}, filters: {}, handle: null, scannedAt: null, restored: false, name: '' };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
const TEXT_EXT = new Set(['json', 'tf', 'tfvars', 'yaml', 'yml', 'hcl', 'md', 'txt']);
const INFRALENS_FILES = new Set(['repos.txt', 'sync-status.json']); // written by sync.cmd / this page

async function readHandle(dir) {
  const files = [];
  async function walk(handle, prefix) {
    for await (const [name, h] of handle.entries()) {
      if (name === '.git' || name === 'node_modules' || name === '.terraform') continue;
      const p = prefix ? prefix + '/' + name : name;
      if (h.kind === 'directory') await walk(h, p);
      else { const ext = name.split('.').pop().toLowerCase(); if (TEXT_EXT.has(ext)) { const file = await h.getFile(); files.push({ path: p, name, ext, text: await file.text(), mtime: file.lastModified }); } }
    }
  }
  await walk(dir, '');
  return files;
}
async function openWithPicker() {
  if (!window.showDirectoryPicker) { $('#dirInput').click(); return; }
  let dir;
  try { dir = await window.showDirectoryPicker({ mode: 'read' }); } catch (e) { return; }
  const files = await readHandle(dir);
  S.handle = dir;
  load(dir.name, files);
  persist(dir.name, files, dir);
}
// Re-read the folder that was opened before (works across page reloads in
// Chrome/Edge because the folder handle is kept in IndexedDB). Falls back to the
// picker when no handle is available.
async function rescan() {
  if (S.fromEstate && !S.handle) { location.reload(); return; }
  const h = S.handle;
  if (h && h.requestPermission) {
    try {
      let perm = await h.queryPermission({ mode: 'read' });
      if (perm !== 'granted') perm = await h.requestPermission({ mode: 'read' });
      if (perm === 'granted') { const files = await readHandle(h); load(h.name, files); persist(h.name, files, h); return; }
    } catch (e) { console.warn('re-scan via saved handle failed, falling back to picker', e); }
  }
  openWithPicker();
}
async function openFromInput(ev) {
  const list = Array.from(ev.target.files || []);
  if (!list.length) return;
  const root = (list[0].webkitRelativePath || '').split('/')[0];
  const files = [];
  for (const f of list) {
    const rel = (f.webkitRelativePath || f.name).split('/').slice(1).join('/');
    if (/(^|\/)(\.git|node_modules|\.terraform)\//.test(rel)) continue;
    const ext = f.name.split('.').pop().toLowerCase();
    if (TEXT_EXT.has(ext)) files.push({ path: rel, name: f.name, ext, text: await f.text(), mtime: f.lastModified });
  }
  S.handle = null;
  load(root, files);
  persist(root, files, null);
  ev.target.value = '';
}

/* ---- saved copy: the files read last time live in IndexedDB so a refresh (or a
   fresh browser start) shows the same dashboard without picking the folder again.
   Only this browser profile on this machine can read it. ---- */
const DB_NAME = 'infralens', DB_STORE = 'kv';
function idb() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
  });
}
async function kvGet(k) { try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return undefined; } }
async function kvSet(k, v) { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction(DB_STORE, 'readwrite'); t.objectStore(DB_STORE).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { console.warn('could not save', k, e); return false; } }
async function kvDel(k) { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction(DB_STORE, 'readwrite'); t.objectStore(DB_STORE).delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { /* ignore */ } }
async function persist(name, files, handle) {
  const ok = await kvSet('repo', { name, scannedAt: S.scannedAt, files: files.map(f => ({ path: f.path, name: f.name, ext: f.ext, text: f.text, mtime: f.mtime })) });
  if (handle) await kvSet('handle', handle); else await kvDel('handle');
  S.saved = ok; renderStatus();
}
async function restore() {
  const saved = await kvGet('repo');
  if (!saved || !saved.files || S.model) return;
  S.handle = (await kvGet('handle')) || null;
  S.saved = true;
  load(saved.name, saved.files, { scannedAt: saved.scannedAt, restored: true });
}
async function forgetSaved() {
  await kvDel('repo'); await kvDel('handle');
  S.handle = null; S.saved = false; S.model = null; S.files = []; S.restored = false; S.name = '';
  $('#repoName').textContent = ''; $('#search').disabled = true; $('#btnExport').disabled = true; $('#btnRescan').disabled = true;
  go('overview');
}
const fmtTime = (iso) => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString(undefined, { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); };
function renderStatus() {
  if (!S.model) return;
  $('#repoName').textContent = `${S.name} · ${window.InfraLensAdapter.name} · ${S.fromEstate ? 'from sync at' : S.restored ? 'saved copy from' : 'scanned'} ${fmtTime(S.scannedAt)}`;
  $('#btnRescan').disabled = false;
  $('#btnRescan').textContent = S.fromEstate ? 'Reload' : 'Re-scan';
  $('#btnRescan').title = S.fromEstate ? 'Reload estate.js written by the last sync' : S.handle ? 'Re-read ' + S.name + ' from disk (after git pull)' : 'Pick the folder again to re-read it';
}
// On startup: estate.js from the last sync wins unless a saved copy is newer.
async function boot() {
  const est = window.__INFRALENS_ESTATE__;
  const saved = est ? await kvGet('repo') : null;
  if (est && est.files && !(saved && saved.scannedAt && est.generated_at && new Date(saved.scannedAt) > new Date(est.generated_at))) {
    S.handle = (await kvGet('handle')) || null;
    load(est.name || 'repos', est.files.map(f => ({ path: f.path, text: f.text })), { scannedAt: est.generated_at, estate: true });
    return;
  }
  restore();
}
function load(name, files, opts) {
  opts = opts || {};
  S.name = name; S.scannedAt = opts.scannedAt || new Date().toISOString(); S.restored = !!opts.restored; S.fromEstate = !!opts.estate;
  for (const f of files) { if (!f.name) f.name = f.path.split('/').pop(); if (!f.ext) f.ext = f.name.split('.').pop().toLowerCase(); }
  for (const f of files) { if (f.ext === 'json') { try { f.json = JSON.parse(f.text); } catch (e) { f.parseError = e.message; } } }
  S.files = files.sort((a, b) => a.path.localeCompare(b.path));
  const adapters = window.InfraLensAdapters || [];
  const adapter = adapters.find(a => { try { return a.detect && a.detect(files); } catch (e) { return false; } }) || adapters[0];
  if (!adapter) { alert('No adapter loaded. Check the adapters/ folder is next to index.html.'); return; }
  window.InfraLensAdapter = adapter;
  S.model = normalize(adapter.extract(files));
  S.index = buildIndex(S.model);
  S.findings = runFindings(S.model);
  S.selected = null; S.query = '';
  $('#search').disabled = false; $('#search').value = ''; $('#btnExport').disabled = false;
  renderStatus();
  let section = 'overview';
  if (opts.restored) { try { const s = localStorage.getItem('infralens.section'); if (s && SECTIONS.some(x => x.id === s)) section = s; } catch (e) { /* ignore */ } }
  go(section);
}

// Fill defaults, derive WIF bindings from principalSet IAM bindings, de-dup.
function normalize(m) {
  const kinds = ['folders','projects','networks','subnets','peerings','firewall_rules','iam_bindings','service_accounts','wif_pools','wif_providers','wif_bindings','access_levels','vpc_sc_perimeters','org_policies','other','errors'];
  for (const k of kinds) if (!Array.isArray(m[k])) m[k] = [];
  m.meta = m.meta || {};
  const seen = new Set(m.wif_bindings.map(b => b.id));
  for (const b of m.iam_bindings) {
    if (b.resource_type === 'service_account' && (b.principal_type === 'principalSet' || b.principal_type === 'principal')) {
      const mm = b.principal.match(/workloadIdentityPools\/([^/]+)\/(.*)$/);
      const poolName = mm ? mm[1] : '?';
      const pool = m.wif_pools.find(p => p.name === poolName);
      const poolId = pool ? pool.id : poolName; const pset = mm ? mm[2] : b.principal;
      const dup = m.wif_bindings.some(w => w.pool === poolId && w.service_account === b.resource && w.principal_set === pset);
      const id = `derived:${b.id}`;
      if (!dup && !seen.has(id)) { seen.add(id); m.wif_bindings.push({ id, pool: poolId, service_account: b.resource, principal_set: pset, derived_from: b.id, source: b.source }); }
    }
  }
  return m;
}

/* =========================================================================
   4. INDEX + RELATIONSHIP GRAPH (generic: derived from id references)
   ========================================================================= */
const KIND_LABEL = { folders: 'Folder', projects: 'Project', networks: 'Network', subnets: 'Subnet', peerings: 'Peering', firewall_rules: 'Firewall rule', iam_bindings: 'IAM binding', service_accounts: 'Service account', wif_pools: 'WIF pool', wif_providers: 'WIF provider', wif_bindings: 'WIF binding', access_levels: 'Access level', vpc_sc_perimeters: 'VPC-SC perimeter', org_policies: 'Org policy', other: 'Terraform object' };
function buildIndex(m) {
  const byId = new Map(); const edges = new Map(); // id -> [{to, label}]
  const add = (kind, e) => byId.set(kind + '#' + e.id, { kind, e });
  for (const k of Object.keys(KIND_LABEL)) for (const e of m[k]) add(k, e);
  const link = (a, b, label) => { if (!byId.has(a) || !byId.has(b)) return; (edges.get(a) || edges.set(a, []).get(a)).push({ to: b, label }); (edges.get(b) || edges.set(b, []).get(b)).push({ to: a, label }); };
  const saKey = (email) => 'service_accounts#' + email.replace(/^serviceAccount:/, '');
  for (const p of m.projects) { if (p.folder) link('projects#' + p.id, 'folders#' + p.folder, 'in folder'); if (p.shared_vpc_host) link('projects#' + p.id, 'projects#' + p.shared_vpc_host, 'shared VPC host'); }
  for (const f of m.folders) { const par = (f.parent || '').replace('folders/', ''); link('folders#' + f.id, 'folders#' + par, 'parent'); }
  for (const n of m.networks) { link('networks#' + n.id, 'projects#' + n.project, 'project'); (n.service_projects || []).forEach(sp => link('networks#' + n.id, 'projects#' + sp, 'service project')); }
  for (const s of m.subnets) link('subnets#' + s.id, 'networks#' + s.network, 'network');
  for (const p of m.peerings) link('peerings#' + p.id, 'networks#' + p.network, 'network');
  for (const r of m.firewall_rules) { link('firewall_rules#' + r.id, 'networks#' + r.network, 'network'); link('firewall_rules#' + r.id, 'projects#' + r.project, 'project'); (r.target_service_accounts || []).forEach(sa => link('firewall_rules#' + r.id, saKey(sa), 'targets SA')); }
  for (const sa of m.service_accounts) link('service_accounts#' + sa.id, 'projects#' + sa.project, 'project');
  for (const b of m.iam_bindings) {
    const me = 'iam_bindings#' + b.id;
    if (b.resource_type === 'project') link(me, 'projects#' + b.resource, 'on project');
    if (b.resource_type === 'folder') link(me, 'folders#' + b.resource, 'on folder');
    if (b.resource_type === 'service_account') link(me, saKey(b.resource), 'on SA');
    if (b.principal_type === 'serviceAccount') link(me, saKey(b.principal), 'granted to SA');
  }
  for (const p of m.wif_pools) link('wif_pools#' + p.id, 'projects#' + p.project, 'project');
  for (const p of m.wif_providers) link('wif_providers#' + p.id, 'wif_pools#' + p.pool, 'pool');
  for (const b of m.wif_bindings) { link('wif_bindings#' + b.id, 'wif_pools#' + b.pool, 'pool'); link('wif_bindings#' + b.id, saKey(b.service_account), 'acts as SA'); }
  for (const p of m.vpc_sc_perimeters) { p.projects.forEach(pr => link('vpc_sc_perimeters#' + p.id, 'projects#' + pr, 'contains')); (p.access_levels || []).forEach(al => link('vpc_sc_perimeters#' + p.id, 'access_levels#' + al, 'access level')); }
  for (const p of m.org_policies) { if (p.scope_type === 'project') link('org_policies#' + p.id, 'projects#' + p.scope, 'on project'); if (p.scope_type === 'folder') link('org_policies#' + p.id, 'folders#' + p.scope, 'on folder'); }
  // principal index: who appears where
  const principals = new Map();
  for (const b of m.iam_bindings) (principals.get(b.principal) || principals.set(b.principal, []).get(b.principal)).push(b);
  return { byId, edges, principals };
}
function runFindings(m) {
  const out = [];
  for (const rule of FINDINGS) { let hits = []; try { hits = rule.test(m) || []; } catch (e) { console.warn('rule failed', rule.id, e); }
    for (const h of hits) out.push({ rule: rule.id, severity: rule.severity, title: rule.title, ...h }); }
  const order = { high: 0, med: 1, low: 2 };
  return out.sort((a, b) => order[a.severity] - order[b.severity] || a.title.localeCompare(b.title));
}
const findingsFor = (kind, id) => S.findings.filter(f => f.entity_kind === kind && f.entity_id === id);

// ---- generic table ----
function fmt(val, type, col) {
  if (val == null || (Array.isArray(val) && !val.length)) return '<span class="muted">–</span>';
  switch (type) {
    case 'bool': return val ? '✓' : '<span class="muted">–</span>';
    case 'mono': return `<span class="mono">${esc(val)}</span>`;
    case 'list': return val.map(x => `<span class="chip mono">${esc(x)}</span>`).join('');
    case 'ranges': return val.map(x => `<span class="chip mono">${esc(x.name)} ${esc(x.cidr)}</span>`).join('');
    case 'ports': return val.map(x => `<span class="chip mono">${esc(x.protocol)}${x.ports ? ':' + esc(x.ports.join(',')) : ''}</span>`).join('');
    default: return typeof val === 'object' ? `<span class="mono">${esc(JSON.stringify(val))}</span>` : esc(val);
  }
}

function parseRepos(text) {
  return text.split(/\r?\n/).map(l => l.replace(/#.*$/, '').trim()).filter(Boolean).map(l => { const [url, folder] = l.split(/\s+/); const name = folder || url.split('/').pop().replace(/\.git$/, '').replace(/^.*:/, ''); return { url, name }; });
}
function syncStatus() {
  const f = S.files.find(x => x.path === 'sync-status.json'); if (!f || !f.json) return null;
  const j = f.json; const when = f.mtime ? fmtTime(new Date(f.mtime).toISOString()) : (j.synced_at || '');

}

async function saveRepos(text) {
  if (!text.endsWith('\n')) text += '\n';
  const msg = $('#reposMsg');
  let wrote = false;
  if (!S.handle && window.showDirectoryPicker && confirm('Pick the InfraLens folder (the one with index.html and sync.cmd) so repos.txt can be written there. Cancel = download the file instead.')) {
    try { S.handle = await window.showDirectoryPicker({ mode: 'readwrite' }); } catch (e) { /* cancelled */ }
  }
  if (S.handle && S.handle.getFileHandle) {
    try {
      let perm = await S.handle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await S.handle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') { const fh = await S.handle.getFileHandle('repos.txt', { create: true }); const w = await fh.createWritable(); await w.write(text); await w.close(); wrote = true; }
    } catch (e) { console.warn('could not write repos.txt', e); }
  }
  const f = S.files.find(x => x.path === 'repos.txt');
  if (f) { f.text = text; f.mtime = Date.now(); } else S.files.push({ path: 'repos.txt', name: 'repos.txt', ext: 'txt', text, mtime: Date.now() });
  S.files.sort((a, b) => a.path.localeCompare(b.path));
  await persist(S.name, S.files, S.handle);
  if (!wrote) download('repos.txt', text);
  renderNav(); renderView();
  const m2 = $('#reposMsg'); if (m2) m2.textContent = wrote ? `Saved repos.txt. Run sync.cmd to clone the new repositories.` : `repos.txt was downloaded — put it in the InfraLens folder next to sync.cmd, then run sync.cmd.`;
}

function sourceSnippet(e) {
  const f = S.files.find(x => x.path === (e.source && e.source.file)); if (!f) return JSON.stringify(e, null, 2);
  if (e.source.line) { // HCL source: show the block
    const lines = f.text.split('\n'); const a = Math.max(0, e.source.line - 1), b = Math.min(lines.length, a + 30);
    return lines.slice(a, b).map((l, i) => String(a + i + 1).padStart(4) + '  ' + l).join('\n') + (b < lines.length ? '\n      …' : '');
  }
  if (f.json && e.source.path) { // JSON source: show the node the path points at
    const node = e.source.path.replace(/\["([^"]*)"\]/g, '.$1').replace(/\[(\d+)\]/g, '.$1').split('.').filter(Boolean).reduce((a, k) => (a == null ? undefined : a[k]), f.json);
    if (node !== undefined) return JSON.stringify(node, null, 2);
  }
  return JSON.stringify(e.data || e, null, 2);
}

// ---- wiring + utilities ----
function wire(root) {

    if (S.query) { S.query = ''; $('#search').value = ''; const sec = SECTIONS.find(s => s.kind === kind); S.section = sec ? sec.id : S.section; }
    S.selected = key; renderNav(); renderView(); renderDrawer(); }));
  root.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', (ev) => { ev.preventDefault(); go(el.dataset.go); }));
  root.querySelectorAll('[data-filter]').forEach(el => el.addEventListener('change', () => { S.filters[el.dataset.filter] = el.value; renderView(); }));
  root.querySelectorAll('[data-rowfilter]').forEach(el => { let t; el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { S.filters[el.dataset.rowfilter] = el.value; const pos = el.selectionStart; renderView(); const n = $(`[data-rowfilter="${el.dataset.rowfilter}"]`); n.focus(); n.setSelectionRange(pos, pos); }, 150); }); });
}
function toCsv(rows) { if (!rows.length) return ''; const cols = Object.keys(rows[0]); const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"'; return [cols.join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\n'); }
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

$('#btnOpen').onclick = openWithPicker;
$('#btnRescan').onclick = rescan;
$('#dirInput').addEventListener('change', openFromInput);
$('#btnExport').onclick = () => download('infralens-model.json', JSON.stringify(S.model, null, 2));
$('#btnTheme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dark ? 'light' : 'dark'; };
let st; $('#search').addEventListener('input', (e) => { clearTimeout(st); st = setTimeout(() => { S.query = e.target.value.trim(); S.selected = null; renderView(); renderDrawer(); }, 200); });
$('#search').addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.target.value = ''; S.query = ''; renderView(); } });
document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('#search') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#search').focus(); } });

renderNav(); renderView();
if (!window.__INFRALENS_DEMO__) boot();
})();
</script>
</body>
